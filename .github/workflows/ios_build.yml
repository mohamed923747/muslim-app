name: Build Muslim App (Android & iOS)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 1. بناء تطبيق الأندرويد (Android APK)
  # ----------------------------------------------------
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android Release APK
        run: |
          if [ -d "flutter_subha_app" ]; then
            cd flutter_subha_app
          fi
          flutter config --no-analytics
          flutter create --platforms=android --org com.muslim.app .
          flutter pub get
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MuslimApp-Android-APK
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
          if-no-files-found: error

  # ----------------------------------------------------
  # 2. بناء تطبيق الآيفون (iOS IPA - Unsigned)
  # ----------------------------------------------------
  build-ios:
    name: 🍏 Build iOS IPA (Unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS project and dependencies
        run: |
          if [ -d "flutter_subha_app" ]; then
            cd flutter_subha_app
          fi
          flutter config --no-analytics
          flutter create --platforms=ios --org com.muslim.app .
          flutter pub get
          flutter build ios --config-only --release

      - name: Build iOS Archive without Signing Certificate
        run: |
          if [ -d "flutter_subha_app" ]; then
            cd flutter_subha_app
          fi
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          if [ -d "flutter_subha_app" ]; then
            cd flutter_subha_app
          fi
          mkdir -p Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r MuslimApp-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: MuslimApp-iOS-IPA
          path: "**/MuslimApp-iOS.ipa"
          if-no-files-found: error
