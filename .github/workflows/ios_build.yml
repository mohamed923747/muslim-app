name: Build Muslim App (Android & iOS)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 1. بناء تطبيق الأندرويد (APK)
  # ----------------------------------------------------
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create platform files and get dependencies
        run: |
          cd flutter_subha_app
          flutter create --platforms=android .
          flutter pub get

      - name: Build Android APK Release
        run: |
          cd flutter_subha_app
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MuslimApp-Android-APK
          path: flutter_subha_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ----------------------------------------------------
  # 2. بناء تطبيق الآيفون (iOS IPA - Unsigned)
  # ----------------------------------------------------
  build-ios:
    name: 🍏 Build iOS IPA (Unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create iOS platform files and get dependencies
        run: |
          cd flutter_subha_app
          flutter create --platforms=ios --org com.muslim.app .
          flutter pub get

      - name: Build iOS Release (No Codesign)
        run: |
          cd flutter_subha_app
          flutter build ios --release --no-codesign

      - name: Package into .ipa
        run: |
          cd flutter_subha_app
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r MuslimApp-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: MuslimApp-iOS-IPA
          path: flutter_subha_app/MuslimApp-iOS.ipa
          if-no-files-found: error
