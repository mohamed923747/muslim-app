name: Build Muslim App (Android & iOS)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 1. بناء تطبيق الأندرويد (Android APK)
  # ----------------------------------------------------
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Project & Build APK
        run: |
          if [ -d "flutter_subha_app" ]; then
            cd flutter_subha_app
          fi
          
          flutter config --no-analytics
          flutter create --platforms=android --org com.muslim.app .
          flutter pub get
          
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi
          
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MuslimApp-Android-APK
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
          if-no-files-found: warn

  # ----------------------------------------------------
  # 2. بناء تطبيق الآيفون (iOS IPA - Unsigned)
  # ----------------------------------------------------
  build-ios:
    name: 🍏 Build iOS IPA (Unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare iOS Project & Build Unsigned IPA
        run: |
          if [ -d "flutter_subha_app" ]; then
            cd flutter_subha_app
          fi
          
          flutter config --no-analytics
          flutter create --platforms=ios --org com.muslim.app .
          flutter pub get
          
          flutter build ios --release --no-codesign --simulator
          
          mkdir -p Payload
          cp -r build/ios/iphonesimulator/Runner.app Payload/
          zip -r MuslimApp-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: MuslimApp-iOS-IPA
          path: "**/MuslimApp-iOS.ipa"
          if-no-files-found: warn
